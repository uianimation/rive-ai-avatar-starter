name: Bug report
description: Report a reproducible problem with this starter
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the expected and actual behavior. Do not upload confidential assets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node version, binding mode
    validations:
      required: true
